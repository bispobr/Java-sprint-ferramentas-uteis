spring.application.name=ferramentas

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DEV_Database_url}
spring.datasource.username=${DEV_Postgres_User}
spring.datasource.password=${DEV_Postgres_Password}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

logging.level.root=INFO

management.endpoints.web.exposure.include=health,metrics,swagger-ui,prometheus
management.endpoint.health.show-details = always

management.metrics.enable.all=true
springdoc.show-actuator=true
management.endpoint.prometheus.enabled=true

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m


app.cors.allowed-origins=http://localhost:3000,https://meu-frontend.com


app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS


app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With


app.cors.exposed-headers=Authorization

app.cors.allow-credentials=true

app.cors.max-age=3600

